[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-prompting-repo-intelligence"
version = "0.1.0"
description = "Deterministic repository graph and change-impact engine"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
repo-intel = "repo_intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["repo_intelligence*"]
